<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablas de multiplicar</title>
    <link rel="stylesheet" href="multiplicar.css">
</head>
<body>
    <div class="contenedor">

        <header class="encabezado">
            <p class="etiqueta">¡ENTRENA TU MENTE!</p>

            <h1>¡La tabla del <span id="tituloTabla">3</span>!</h1>

            <p class="descripcion">
                ¡Practica las multiplicaciones y diviértete aprendiendo!
            </p>

            <div class="formulario">
                <label for="numeroTabla">¿Qué tabla quieres aprender?</label>

                <input
                    type="number"
                    id="numeroTabla"
                    min="1"
                    max="100"
                    placeholder="Ejemplo: 8"
                    aria-describedby="ayudaNumero"
                >

                <p class="ayuda" id="ayudaNumero">
                    Escribe un número del 1 al 100 y presiona PROBAR.
                </p>
            </div>

            <button class="boton-probar" onclick="generarTablas()">
                PROBAR
            </button>

            <p id="mensaje" class="mensaje" aria-live="polite">
                ¡La tabla del 3 está lista para practicar!
            </p>
        </header>

        <section class="panel-tabla">
            <h2>Tabla de multiplicar</h2>

            <div class="tabla" id="contenedor"></div>
        </section>

        <footer class="pie">
            <p>Creado por: Tu nickname</p>
            <p>¡Aprender también puede ser una aventura!</p>
        </footer>

    </div>

    <script src="multiplicar.js"></script>
</body>
</html>
