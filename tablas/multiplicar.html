
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablas de multiplicar</title>
    <link rel="stylesheet" href="multiplicar.css">
</head>
<body>

    <div class="contenedor">

        <header class="encabezado">
            <p class="etiqueta">¡ENTRENA TU MENTE!</p>

            <h1>¡La tabla del <span id="tituloTabla">3</span>!</h1>

            <p class="descripcion">
                ¡Practica las multiplicaciones y diviértete aprendiendo!
            </p>

            <div class="formulario">
                <label for="numeroTabla">Escribe un número:</label>
                <input
                    type="number"
                    id="numeroTabla"
                    placeholder="Ejemplo: 5"
                >
            </div>

            <button class="boton-probar" onclick="generarTablas(5)">
                PROBAR
            </button>
        </header>

        <section class="panel-tabla">
            <h2>Tabla de multiplicar</h2>

            <div class="tabla" id="contenedor"></div>
        </section>

        <footer class="pie">
            <p>Creado por: Tu nickname</p>
        </footer>

    </div>

    <script src="multiplicar.js"></script>
</body>
</html>
